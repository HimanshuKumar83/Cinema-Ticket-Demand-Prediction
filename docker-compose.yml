version: '3.8'

services:
  dashboard:
    build: .
    container_name: cinema_ticket_dashboard
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    command: ["streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

  api:
    build: .
    container_name: cinema_ticket_api
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
